<table>
  @if(laps().length !== 0){
  <thead>
    <tr>
      <th>Runda</th>
      <th>Czas ogółem</th>
      <th>Czas rundy</th>
    </tr>
  </thead>
  <tbody>
    @for (lap of laps(); track lap.lap; let i = $index){
    <tr [class.stopwatch-laps__row--best]="lap.lap === bestLap()?.lap">
      <td>{{ lap.lap }}</td>
      <td>{{ lap.overallTime }}</td>
      <td>{{ lap.lapTime }}</td>
    </tr>
    }
  </tbody>
  }
</table>
